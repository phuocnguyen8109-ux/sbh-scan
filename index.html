<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SBH – quét mã</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; max-width: 520px; color: #222; }
    h3 { margin: 0 0 6px; }
    p { margin: 0 0 8px; color: #555; }
    button, label.btn { display: block; width: 100%; padding: 14px; margin: 10px 0; font-size: 16px; font-family: inherit;
      border: 1px solid #888; border-radius: 10px; background: #f5f5f5; color: #222; text-align: center; box-sizing: border-box; }
    button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    #reader { width: 100%; margin-top: 8px; border-radius: 10px; overflow: hidden; }
    #out { margin-top: 12px; padding: 12px; border-radius: 10px; background: #f0efec; white-space: pre-wrap; }
    .ok { background: #e5f4e4 !important; } .bad { background: #fbebeb !important; }
    input[type=file] { display: none; }
    #list { margin-top: 12px; font-size: 14px; }
    #list div { padding: 6px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <h3>SBH – thử quét mã</h3>
  <p>Quét một hộp mỹ phẩm và một nhãn vận đơn 7-11/Family. Kết quả tự ghi vào tab Log trong SBH_CauHinh.</p>

  <button id="live" class="primary">Mở camera quét trực tiếp</button>
  <button id="stop" style="display:none">Tắt camera</button>
  <label class="btn" for="photo">Dự phòng: chụp ảnh mã vạch</label>
  <input id="photo" type="file" accept="image/*" capture="environment">

  <div id="reader"></div>
  <div id="out">Chưa quét.</div>
  <div id="list"></div>

<script>
  // Link web app Apps Script (Triển khai → URL ứng dụng web). Trang này chỉ gửi kết quả quét thử, không đọc dữ liệu.
  const API_URL = 'https://script.google.com/macros/s/AKfycbyiJ2__5HzcRAV6soRF6TbNd3uAXkPi0EUYFkkyrjQ4jb8tT7Yh7nQ_upA5uduJnhFo/exec';

  const out = document.getElementById('out');
  const list = document.getElementById('list');
  const btnLive = document.getElementById('live');
  const btnStop = document.getElementById('stop');
  const F = Html5QrcodeSupportedFormats;
  const formats = [F.EAN_13, F.EAN_8, F.CODE_128, F.CODE_39, F.UPC_A, F.QR_CODE];
  const config = { formatsToSupport: formats, verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } };
  let scanner = null, running = false, lastCode = '', lastAt = 0;

  function show(text, ok) { out.textContent = text; out.className = ok ? 'ok' : (ok === false ? 'bad' : ''); }
  function addToList(text) {
    const d = document.createElement('div');
    d.textContent = new Date().toLocaleTimeString('vi-VN') + '  ' + text;
    list.prepend(d);
  }
  function report(r) {
    r.action = 'cameraTest';
    r.ua = navigator.userAgent;
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(r) })
      .then(res => res.json())
      .then(j => { if (!j.ok) addToList('⚠️ Không ghi được Log: ' + (j.error || '')); })
      .catch(e => addToList('⚠️ Không gửi được về Sheets: ' + e.message));
  }
  function beep() {
    try { navigator.vibrate && navigator.vibrate(80); } catch (e) {}
    try {
      const a = new (window.AudioContext || window.webkitAudioContext)();
      const o = a.createOscillator(); o.frequency.value = 1200; o.connect(a.destination);
      o.start(); setTimeout(() => { o.stop(); a.close(); }, 120);
    } catch (e) {}
  }

  btnLive.onclick = async () => {
    if (running) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      show('Trình duyệt này không cho mở camera. Mở link bằng Safari hoặc Chrome (không mở trong Telegram/Zalo).', false);
      report({ mode: 'live-gh', ok: false, error: 'no mediaDevices' });
      return;
    }
    try {
      scanner = scanner || new Html5Qrcode('reader', config);
      await scanner.start({ facingMode: 'environment' }, { fps: 12, qrbox: { width: 280, height: 140 } },
        (text, res) => {
          const now = Date.now();
          if (text === lastCode && now - lastAt < 2500) return; // tránh ghi trùng khi mã còn trong khung
          lastCode = text; lastAt = now;
          const fmt = res && res.result && res.result.format ? res.result.format.formatName : '';
          beep();
          show('Camera trực tiếp chạy được ✅\nMã: ' + text + '\nLoại: ' + fmt, true);
          addToList(text + ' (' + fmt + ')');
          report({ mode: 'live-gh', ok: true, code: text, format: fmt });
        }, () => {});
      running = true;
      btnLive.style.display = 'none'; btnStop.style.display = 'block';
      show('Camera đang mở. Đưa mã vạch vào khung, giữ cách 10–20 cm.');
    } catch (e) {
      const msg = String(e && e.message ? e.message : e);
      show('Không mở được camera: ' + msg + '\n\nNếu điện thoại hỏi quyền camera, chọn Cho phép. Trên iPhone: Cài đặt → Safari → Camera → Hỏi/Cho phép.', false);
      report({ mode: 'live-gh', ok: false, error: msg });
    }
  };

  btnStop.onclick = async () => {
    try { await scanner.stop(); } catch (e) {}
    running = false;
    btnStop.style.display = 'none'; btnLive.style.display = 'block';
    show('Đã tắt camera.');
  };

  document.getElementById('photo').onchange = async (ev) => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    if (running) { try { await scanner.stop(); } catch (e) {} running = false; btnStop.style.display = 'none'; btnLive.style.display = 'block'; }
    try {
      scanner = scanner || new Html5Qrcode('reader', config);
      const text = await scanner.scanFile(file, false);
      beep();
      show('Chụp ảnh chạy được ✅\nMã: ' + text, true);
      addToList(text + ' (ảnh)');
      report({ mode: 'photo-gh', ok: true, code: text });
    } catch (e) {
      show('Không đọc được mã trong ảnh. Chụp gần hơn, đủ sáng, mã vạch nằm ngang rồi thử lại.', false);
      report({ mode: 'photo-gh', ok: false, error: String(e && e.message ? e.message : e) });
    }
    ev.target.value = '';
  };
</script>
</body>
</html>
